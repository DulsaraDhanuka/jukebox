name: jukebox
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.10.1

dependencies:
  file_picker: ^10.3.7
  flutter:
    sdk: flutter
  media_kit: ^1.2.2
  media_kit_video: ^2.0.0
  media_kit_libs_video: ^1.0.7
  window_manager: ^0.5.1
  mime: ^2.0.0
  player_service:
    path: packages/player_service
  library_api:
    path: packages/library_api
  library_repository:
    path: packages/library_repository
  local_storage_library_api:
    path: packages/local_storage_library_api
  flutter_bloc: ^9.1.1
  hydrated_bloc: ^10.1.1
  equatable: ^2.0.7
  bloc: ^9.1.0
  json_annotation: ^4.9.0
  path_provider: ^2.1.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  custom_lint: ^0.8.1
  bloc_test: ^10.0.0
  mocktail: ^1.0.4
  json_serializable: ^6.11.2
  build_runner: ^2.10.4
  bloc_lint: ^0.3.5

flutter:
  uses-material-design: true
